# ╔══════════════════════════════════════════════════════════════════════════╗
# ║  APK-MORPHER — Automated Patch, Sign & Release Pipeline                ║
# ║                                                                        ║
# ║  Triggered on schedule, manual dispatch, or when apps.yaml changes.    ║
# ║  Reads apps.yaml, builds a matrix of apps, patches & signs each one,   ║
# ║  publishes to a rolling GitHub Release, and deploys a static           ║
# ║  Obtainium-compatible catalog to GitHub Pages.                         ║
# ╚══════════════════════════════════════════════════════════════════════════╝

name: Build & Release

on:
  workflow_dispatch:
    inputs:
      force_full_rebuild:
        description: "Rebuild every app (ignore incremental check)"
        type: boolean
        required: false
        default: false
  push:
    paths:
      - 'apps.yaml'
    branches:
      - main
  schedule:
    - cron: '0 4 * * *'   # Daily at 04:00 UTC — edit in apps.yaml settings

permissions:
  contents: write
  pages: write
  id-token: write
  actions: write

concurrency:
  group: "build"
  cancel-in-progress: true

jobs:
  # ── 1. Prepare: keystore, update check, matrix ──────────────────────
  prepare:
    name: Prepare Build Plan
    runs-on: ubuntu-latest
    outputs:
      has_updates: ${{ steps.check.outputs.has_updates }}
      build_matrix: ${{ steps.check.outputs.build_matrix }}
      update_count: ${{ steps.check.outputs.update_count }}
      total_count: ${{ steps.check.outputs.total_count }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Dependencies
        run: pip install -r requirements.txt

      - name: Ensure Keystore Exists
        env:
          SIGNING_KEYSTORE_BASE64: ${{ secrets.SIGNING_KEYSTORE_BASE64 }}
          SIGNING_KEY_PASS: ${{ secrets.SIGNING_KEY_PASS }}
        run: |
          mkdir -p keystore
          if [ -n "$SIGNING_KEYSTORE_BASE64" ]; then
            echo "$SIGNING_KEYSTORE_BASE64" | base64 -d > keystore/release.jks
            echo "[OK] Keystore restored from secret"
          elif [ -f keystore/release.jks ]; then
            echo "[OK] Keystore found in repo"
          else
            echo "[INFO] No keystore found — generating a new one..."
            PASS=$(openssl rand -base64 24 | tr -d '/+=' | head -c 32)
            keytool -genkeypair -v \
              -keystore keystore/release.jks \
              -alias apk-morpher \
              -keyalg RSA -keysize 4096 -validity 10000 \
              -storepass "$PASS" -keypass "$PASS" \
              -dname "CN=APK-Morpher, OU=Self-Hosted, O=Personal, C=US"
            echo ""
            echo "╔══════════════════════════════════════════════════════════════╗"
            echo "║  ⚠️  NEW KEYSTORE GENERATED                                 ║"
            echo "║                                                            ║"
            echo "║  Save these as GitHub Secrets to persist across runs:       ║"
            echo "║                                                            ║"
            echo "║  1. SIGNING_KEYSTORE_BASE64:                               ║"
            echo "║     base64 -w0 keystore/release.jks                        ║"
            echo "║                                                            ║"
            echo "║  2. SIGNING_KEY_PASS:                                      ║"
            echo "║     $PASS"
            echo "║                                                            ║"
            echo "║  3. SIGNING_KEY_ALIAS: apk-morpher                         ║"
            echo "║                                                            ║"
            echo "║  Without these secrets, a NEW key is generated each run    ║"
            echo "║  and you cannot update apps (signature mismatch).          ║"
            echo "╚══════════════════════════════════════════════════════════════╝"
            echo ""
            # Export for this run
            echo "SIGNING_KEY_PASS=$PASS" >> $GITHUB_ENV
            echo "SIGNING_KEY_ALIAS=apk-morpher" >> $GITHUB_ENV
            # Also try to set the secret automatically if permissions allow
            echo "$PASS" > /tmp/keypass.txt
            base64 -w0 keystore/release.jks > /tmp/ks64.txt
            gh secret set SIGNING_KEYSTORE_BASE64 < /tmp/ks64.txt 2>/dev/null || echo "[WARN] Could not auto-set SIGNING_KEYSTORE_BASE64 secret (set it manually)"
            gh secret set SIGNING_KEY_PASS < /tmp/keypass.txt 2>/dev/null || echo "[WARN] Could not auto-set SIGNING_KEY_PASS secret (set it manually)"
            rm -f /tmp/keypass.txt /tmp/ks64.txt
          fi
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Run Incremental Update Check
        id: check
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          FORCE_FULL_REBUILD: ${{ inputs.force_full_rebuild || 'false' }}
        run: python -m builder.updater

      - name: Upload Plan Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: build-plan
          path: |
            build_matrix.json
            carry_over.json
            new_manifest.json
          if-no-files-found: warn
          retention-days: 1

      - name: Upload Keystore
        uses: actions/upload-artifact@v4
        with:
          name: keystore
          path: keystore/release.jks
          retention-days: 1

  # ── 2. Build: parallel matrix of app patches ────────────────────────
  build:
    name: "Build ${{ matrix.app_name }}"
    needs: prepare
    if: needs.prepare.outputs.has_updates == 'true'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      max-parallel: 8
      matrix:
        include: ${{ fromJson(needs.prepare.outputs.build_matrix) }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 21
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Dependencies
        run: pip install -r requirements.txt

      - name: Download Keystore
        uses: actions/download-artifact@v4
        with:
          name: keystore
          path: keystore/

      - name: Build APK
        env:
          APP_NAME: ${{ matrix.app_name }}
          SOURCE: ${{ matrix.source }}
          ARCH: ${{ matrix.arch }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SIGNING_KEY_PASS: ${{ secrets.SIGNING_KEY_PASS }}
          SIGNING_KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
          SIGNING_KEYSTORE_PATH: keystore/release.jks
        run: |
          echo "Building ${{ matrix.app_name }} with ${{ matrix.source }}..."
          sleep $((RANDOM % 15))
          python -m builder

      - name: Record Build
        if: always()
        env:
          APP_NAME: ${{ matrix.app_name }}
          SOURCE: ${{ matrix.source }}
          ARCH: ${{ matrix.arch }}
        run: |
          mkdir -p build_records
          for apk in *.apk; do
            [ -e "$apk" ] || continue
            # Create a simple build record
            cat > "build_records/${APP_NAME}-${ARCH}.json" <<EOF
          {
            "app_name": "$APP_NAME",
            "source": "$SOURCE",
            "arch": "$ARCH",
            "apk": "$apk"
          }
          EOF
          done

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: apk-${{ matrix.app_name }}
          path: "*.apk"

      - name: Upload Build Records
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: records-${{ matrix.app_name }}
          path: build_records/
          if-no-files-found: ignore

  # ── 3. Release: aggregate, publish, generate pages ──────────────────
  release:
    name: Publish Release & Pages
    needs: [prepare, build]
    runs-on: ubuntu-latest
    if: always() && needs.prepare.outputs.has_updates == 'true'
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Dependencies
        run: pip install -r requirements.txt

      - name: Download Build Plan
        uses: actions/download-artifact@v4
        with:
          name: build-plan
          path: ./build-plan
        continue-on-error: true

      - name: Download All APKs
        uses: actions/download-artifact@v4
        with:
          path: ./all-apks
          pattern: apk-*
        continue-on-error: true

      - name: Download All Records
        uses: actions/download-artifact@v4
        with:
          path: ./all-records
          pattern: records-*
        continue-on-error: true

      - name: Collect APKs & Build Manifest
        run: |
          mkdir -p release-apks
          find ./all-apks -name "*.apk" -exec cp -f {} ./release-apks/ \; 2>/dev/null || true

          built_count=$(find ./release-apks -name "*.apk" 2>/dev/null | wc -l)
          echo "Built APKs: $built_count"

          if [ "$built_count" -eq 0 ]; then
            echo "skip_release=true" >> $GITHUB_OUTPUT
            exit 0
          fi
          echo "skip_release=false" >> $GITHUB_OUTPUT

          # Merge build records into manifest
          if [ -f ./build-plan/new_manifest.json ]; then
            cp ./build-plan/new_manifest.json ./manifest.json
          fi

          # Update manifest with actual built APK filenames
          python3 - <<'PYEOF'
          import json, glob, os
          manifest = {}
          if os.path.exists("manifest.json"):
              manifest = json.loads(open("manifest.json").read())
          entries = manifest.get("entries", {})
          for rec_file in glob.glob("./all-records/*//*.json"):
              try:
                  rec = json.loads(open(rec_file).read())
                  key = f"{rec['app_name']}-{rec['arch']}-{rec['source']}"
                  if key in entries:
                      entries[key]["apk"] = rec["apk"]
                      entries[key]["built_version"] = rec.get("version", "")
              except Exception:
                  pass
          manifest["entries"] = entries
          open("manifest.json", "w").write(json.dumps(manifest, indent=2))
          PYEOF

        id: collect

      - name: Generate Static Site
        if: steps.collect.outputs.skip_release != 'true'
        env:
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: |
          python -m builder.site_generator public/
          cp manifest.json public/manifest.json

      - name: Publish Release
        if: steps.collect.outputs.skip_release != 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          ASSETS=( ./release-apks/*.apk )
          [ -f manifest.json ] && ASSETS+=( manifest.json )
          [ -f public/obtainium.json ] && ASSETS+=( public/obtainium.json )
          [ -f public/downloads.html ] && ASSETS+=( public/downloads.html )

          if gh release view latest >/dev/null 2>&1; then
            for i in {1..3}; do
              gh release upload latest "${ASSETS[@]}" --clobber && break || {
                [ $i -lt 3 ] && sleep 10
              }
            done
            gh release edit latest \
              --title "APK-Morpher — $(date +'%Y-%m-%d %H:%M')" \
              --notes "Automated release — $(date +'%Y-%m-%d %H:%M UTC'). See the [catalog](https://${{ github.repository_owner }}.github.io/$(echo '${{ github.repository }}' | cut -d/ -f2)/) for details."
          else
            gh release create latest \
              --title "APK-Morpher — $(date +'%Y-%m-%d %H:%M')" \
              --notes "Automated release — $(date +'%Y-%m-%d %H:%M UTC'). See the [catalog](https://${{ github.repository_owner }}.github.io/$(echo '${{ github.repository }}' | cut -d/ -f2)/) for details." \
              --latest \
              "${ASSETS[@]}"
          fi

      - name: Commit Updated Manifest
        if: steps.collect.outputs.skip_release != 'true'
        run: |
          if [ -n "$(git status -s manifest.json public/)" ]; then
            git config --global user.name "github-actions[bot]"
            git config --global user.email "github-actions[bot]@users.noreply.github.com"
            git add -f manifest.json public/
            git commit -m "chore: auto-update manifest and catalog" || true
            git pull --rebase origin main || true
            git push
          fi

      - name: Setup Pages
        if: steps.collect.outputs.skip_release != 'true'
        uses: actions/configure-pages@v4

      - name: Upload Pages Artifact
        if: steps.collect.outputs.skip_release != 'true'
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./public

      - name: Deploy to GitHub Pages
        if: steps.collect.outputs.skip_release != 'true'
        id: deploy
        uses: actions/deploy-pages@v4

  # ── 4. Cleanup ──────────────────────────────────────────────────────
  cleanup:
    name: Cleanup
    needs: [build, release]
    runs-on: ubuntu-latest
    if: always()
    permissions:
      actions: write
    steps:
      - name: Delete Old Workflow Runs
        uses: Mattraks/delete-workflow-runs@v2
        with:
          retain_days: 3
          keep_minimum_runs: 5
